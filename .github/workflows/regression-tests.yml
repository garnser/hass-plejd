name: Plejd regression tests

on:
  push:
  pull_request:

jobs:
  button-replays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install aiohttp bleak bleak-retry-connector pydantic cryptography
      - run: PYTHONPATH="$PWD/custom_components/plejd" python -m unittest discover -s tests/library -v

  home-assistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native API tests in the complete Home Assistant runtime
        run: |
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/workspace -v "$PWD:/workspace" -w /workspace \
            ghcr.io/home-assistant/home-assistant:2026.10.4 \
            -m unittest discover -s tests/runtime -v
